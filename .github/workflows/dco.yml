name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          pattern='^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>$'
          missing=0

          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if ! git log -1 --format='%B' "$sha" | grep -qiE "$pattern"; then
              echo "::error title=Missing sign-off::Commit ${sha} has no valid Signed-off-by line. See CONTRIBUTING.md."
              missing=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are missing a sign-off."
            exit 1
          fi

          echo "All commits are signed off."
