<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!--
      Theme before first paint. Without this a light or amoled user gets a dark
      first frame (and now a dark boot splash). The storage key is the frozen
      legacy one (ADR 019) and the brand string is a literal because this
      markup cannot import src/shared/product.ts; both are asserted against
      their sources by src/shared/ui/brand/brandAssets.test.ts.
    -->
    <script>
      (function applyStoredTheme() {
        try {
          var raw = localStorage.getItem('aether_iptv_settings_v1');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme === 'light') document.documentElement.classList.add('theme-light');
          else if (theme === 'amoled') document.documentElement.classList.add('theme-amoled');
        } catch (err) {
          // First run, private mode or a corrupt value: keep the dark default.
        }
      })();
    </script>
    <!--
      Pre-React boot splash (ADR 022). Deliberately self-contained: the bundled
      stylesheet is imported by the module script at the end of <body>, so
      nothing here may depend on it. The surface colours duplicate the
      --md-sys-color-surface-dim values in src/index.css, and the mark size
      duplicates the --brand-mark-size token there; both are asserted by
      src/shared/ui/brand/brandAssets.test.ts, because an untested copy of a
      token is how the old dark/light first-frame mismatch survived.
    -->
    <style>
      :root {
        --brand-mark-size: 35vmin;
        --boot-surface: #0b0c13;
      }
      html.theme-light {
        --boot-surface: #dcdfe6;
      }
      html.theme-amoled {
        --boot-surface: #000000;
      }
      html,
      body {
        background-color: var(--boot-surface);
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--boot-surface);
      }
      .boot-splash > svg {
        width: var(--brand-mark-size);
        height: var(--brand-mark-size);
      }
      .boot-splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Static fallback; src/main.tsx sets document.title from PRODUCT_NAME. -->
    <title>Streamwala - 10-Foot TV Player</title>
    <meta name="description" content="Production-grade, 100% client-side IPTV web player designed for 10-foot TV remotes, Android TV, Google TV, desktop, and tablet with Material Design 3." />
    <meta property="og:title" content="Streamwala - 10-Foot TV Player" />
    <meta property="og:description" content="Production-grade, 100% client-side IPTV web player designed for 10-foot TV remotes, Android TV, Google TV, desktop, and tablet with Material Design 3." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0c13" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,300..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
