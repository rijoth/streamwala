apply plugin: 'com.android.application'

/**
 * Release signing is read from android/keystore.properties (gitignored).
 * Debug builds always use the Android debug keystore and need no setup.
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

/**
 * The release pipeline stamps the version from the git tag:
 *   -Pstreamwala.versionName=1.2.3 -Pstreamwala.versionCode=1002003
 * (see .github/workflows/release.yml). A local build without those properties
 * keeps the checked-in defaults. Read them into locals: `versionCode (expr)` is
 * ambiguous to the Groovy parser and silently resolves to a method chain.
 */
def streamwalaVersionName = (project.findProperty('streamwala.versionName') ?: '1.0').toString()
def streamwalaVersionCode = (project.findProperty('streamwala.versionCode') ?: '1').toString().toInteger()

android {
    namespace "tv.streamwala.iptv"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tv.streamwala.iptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The release pipeline stamps the version from the git tag:
        //   -Pstreamwala.versionName=1.2.3 -Pstreamwala.versionCode=1002003
        // (see .github/workflows/release.yml and scripts/release.sh). A local
        // build without those properties keeps the checked-in defaults.
        versionCode = streamwalaVersionCode
        versionName = streamwalaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Two installable artifacts from one web bundle:
     *  - mobile : touch devices, portrait allowed, LEANBACK marked unsupported
     *  - tv     : Android TV / Google TV / Fire TV, leanback launcher, landscape,
     *             touchscreen not required, larger TV banner
     *
     * The leanback/touchscreen/screenOrientation values flow into
     * src/main/AndroidManifest.xml through manifest placeholders.
     */
    flavorDimensions "formFactor"
    productFlavors {
        mobile {
            dimension "formFactor"
            applicationId "tv.streamwala.iptv"
            resValue "string", "app_name", "Streamwala"
            // Touch devices need touch-mode WebView focus so tapping a text
            // input raises the soft keyboard (IME). See BUG-018 / MainActivity.
            resValue "bool", "streamwala_touch_device", "true"
            manifestPlaceholders = [
                leanbackRequired  : "false",
                touchscreenRequired: "true",
                screenOrientation : "unspecified"
            ]
        }
        tv {
            dimension "formFactor"
            applicationId "tv.streamwala.iptv.tv"
            resValue "string", "app_name", "Streamwala"
            // No touch input on TV: keep touch-mode focus off so D-pad focus
            // ownership stays deterministic. See BUG-018 / MainActivity.
            resValue "bool", "streamwala_touch_device", "false"
            manifestPlaceholders = [
                leanbackRequired  : "true",
                touchscreenRequired: "false",
                screenOrientation : "landscape"
            ]
        }
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "streamwala-${variant.productFlavors[0].name}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
